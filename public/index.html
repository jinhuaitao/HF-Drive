<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="spinner"></div>
    <p>正在连接存储…</p>
  </div>
</div>

<div id="auth" class="auth-root hidden"></div>
<div id="share-root" class="share-root hidden"></div>

<div id="app" class="app hidden">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 32 32"><path d="M8 12.5l8-4.5 8 4.5v8l-8 4.5-8-4.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M8 12.5l8 4.5 8-4.5M16 17v8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" opacity=".65"/></svg>
      </div>
      <div class="brand-text">
        <strong>HF Drive</strong>
        <span id="brand-sub">HuggingFace 私有存储</span>
      </div>
    </div>

    <button class="upload-btn" id="btn-upload-main">
      <svg class="i"><use href="#i-plus"></use></svg>
      <span>上传文件</span>
    </button>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="files"><svg class="i"><use href="#i-folder"></use></svg><span>全部文件</span></button>
      <button class="nav-item" data-view="starred"><svg class="i"><use href="#i-star"></use></svg><span>收藏</span></button>
      <button class="nav-item" data-view="shares"><svg class="i"><use href="#i-share"></use></svg><span>分享链接</span></button>
      <button class="nav-item" data-view="trash"><svg class="i"><use href="#i-trash"></use></svg><span>回收站</span></button>
    </nav>

    <div class="storage-card" id="storage-card">
      <div class="storage-head">
        <span>已用空间</span>
        <span class="storage-pct" id="storage-pct">—</span>
      </div>
      <div class="storage-bar"><i id="storage-fill"></i><b id="storage-trash"></b></div>
      <div class="storage-text" id="storage-text">—</div>
    </div>

    <div class="sidebar-foot">
      <button class="foot-btn" data-act="theme" title="切换主题"><svg class="i" id="theme-icon"><use href="#i-moon"></use></svg></button>
      <button class="foot-btn" data-act="settings" title="设置"><svg class="i"><use href="#i-settings"></use></svg></button>
      <button class="foot-btn" data-act="logout" title="退出登录"><svg class="i"><use href="#i-logout"></use></svg></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-menu" aria-label="菜单"><svg class="i"><use href="#i-menu"></use></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="search-wrap">
        <svg class="i"><use href="#i-search"></use></svg>
        <input id="search" type="text" placeholder="搜索文件…" autocomplete="off" spellcheck="false" />
        <button class="search-clear hidden" id="search-clear" aria-label="清空"><svg class="i"><use href="#i-x"></use></svg></button>
      </div>
      <div class="topbar-right">
        <div class="seg" id="view-toggle">
          <button data-mode="list" class="active" title="列表视图"><svg class="i"><use href="#i-list"></use></svg></button>
          <button data-mode="grid" title="网格视图"><svg class="i"><use href="#i-grid"></use></svg></button>
        </div>
        <button class="icon-btn" id="btn-refresh" title="刷新"><svg class="i"><use href="#i-refresh"></use></svg></button>
      </div>
    </header>

    <div class="toolbar" id="toolbar"></div>

    <div class="content" id="content">
      <div class="content-inner" id="content-inner"></div>
    </div>
  </main>
</div>

<div id="modal-root"></div>
<div id="upload-panel" class="upload-panel hidden"></div>
<div id="toast-root" class="toast-root"></div>
<div id="drop-overlay" class="drop-overlay hidden"><div class="drop-inner"><svg class="i"><use href="#i-upload"></use></svg><p>松开鼠标上传到当前目录</p></div></div>
<input type="file" id="file-input" multiple hidden />
<input type="file" id="folder-input" webkitdirectory directory multiple hidden />

<script type="module" src="/assets/app.js"></script>
</body>
</html>
